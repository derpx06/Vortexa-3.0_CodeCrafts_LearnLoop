<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Tutor Mascot</title>
<style>
:root{--bg:#0d0f14;--panel:#171a22;--ink:#e9ecf4;--mut:#8b93a7;--acc:#2fd0bd}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:18px;padding:24px 16px;
 background-image:radial-gradient(#1b1f2a 1px,transparent 1px);background-size:22px 22px}
h1{margin:0;font-size:22px}.sub{color:var(--mut);margin-top:-12px;text-align:center}
.stage{display:flex;align-items:flex-end;justify-content:center;gap:12px;width:100%;max-width:900px}
#cv{image-rendering:pixelated;width:400px;max-width:60vw;height:auto;aspect-ratio:1}
.bubble{background:#fff;color:#14161d;border-radius:14px;padding:12px 16px;width:260px;min-height:56px;font:600 15px/1.4 system-ui,sans-serif;position:relative;margin-bottom:180px;box-shadow:0 4px 0 #0006}
.bubble:before{content:"";position:absolute;left:-10px;bottom:18px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:900px}
button{background:var(--panel);color:var(--ink);border:2px solid #2a2f3d;border-radius:8px;padding:8px 14px;font:600 14px system-ui,sans-serif;cursor:pointer}
button:hover{border-color:var(--acc)}button.on{background:var(--acc);color:#06201c;border-color:var(--acc)}
textarea{width:100%;max-width:520px;background:var(--panel);color:var(--ink);border:2px solid #2a2f3d;border-radius:8px;padding:10px;font:inherit}
.row{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;justify-content:center;width:100%}
label{color:var(--mut);font-size:13px;display:flex;gap:6px;align-items:center}
.strip{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:900px;margin-top:6px}
.strip button{padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mut)}
.strip img{width:72px;height:72px;image-rendering:pixelated}
@media(max-width:640px){.stage{flex-direction:column;align-items:center}.bubble{margin:0;order:-1}.bubble:before{display:none}#cv{max-width:80vw}}
</style></head><body>
<h1>The new pixel tutor</h1>
<div class="sub">Pick an animation, or type something and press Speak. He explains while he talks, then relaxes.</div>
<div class="stage"><img id="cv" src="mascot_gifs/mascot_idle.gif?v=4" alt="Pixel tutor mascot"><div class="bubble" id="bub">Hi! Ask me to explain anything.</div></div>
<div class="bar" id="poses"></div>
<div class="row"><textarea id="txt" rows="2">Tokens are the small pieces a model reads. Look over here: each piece gets a number.</textarea>
<button id="speak">Speak</button><button id="tour">Auto tour</button><label><input type="checkbox" id="voice" checked> voice</label></div>
<div class="strip" id="strip"></div>
<script>
const POSES=[
 ["idle","Idle","Hi! Ask me to explain anything."],
 ["listen","Listen","Mm-hm, I'm listening. Go on."],
 ["explain","Explain","Here's how it works: one small step at a time."],
 ["write","Write","Let me note that down so we don't forget."],
 ["thinking","Thinking","Hmm... let me think about that."],
 ["idea","Idea","Oh! I've got an idea!"],
 ["happy","Happy","That's great news!"],
 ["thumbs_up","Thumbs up","Nice, you've got it!"],
 ["cheer","Cheer","Yes! That was a great answer!"],
 ["surprised","Surprised","Whoa, I did not expect that!"],
 ["worried","Worried","Uh-oh... are we sure about this?"],
 ["sad","Sad","Aw, that didn't work out."],
 ["angry","Angry","Grr! Who broke the build?!"],
 ["sleepy","Sleepy","Yaaawn... is it break time yet?"],
 ["point_left","Point left","Look over there, on the left!"],
 ["point_right","Point right","Check out the right side!"],
 ["point_up","Point up","Up here, look at this!"],
 ["point_down","Point down","Down here, this part matters."],
 ["lesson_loop","Lesson loop","Listen, explain, write, nail it, celebrate."]]
const $=id=>document.getElementById(id),cv=$('cv'),bub=$('bub'),bar=$('poses'),strip=$('strip')
let cur='',timer=null,tour=null
function set(n,say){
  cur=n;cv.src='mascot_gifs/mascot_'+n+'.gif?'+Date.now() // restart the animation from frame 0
  const p=POSES.find(x=>x[0]==n);if(say!==false)bub.textContent=p[2]
  document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('on',b.dataset.p==n))}
for(const [n,label] of POSES){
  const b=document.createElement('button');b.dataset.p=n;b.textContent=label;b.onclick=()=>{stop();set(n)};bar.append(b)
  const s=document.createElement('button');s.dataset.p=n;s.innerHTML=`<img src="mascot_gifs/mascot_${n}.gif?v=4" alt=""><span>${label}</span>`;s.onclick=()=>{stop();set(n)};strip.append(s)}
function stop(){clearInterval(timer);clearInterval(tour);tour=null;$('tour').classList.remove('on');speechSynthesis.cancel()}
$('speak').onclick=()=>{stop();const t=$('txt').value.trim();if(!t)return
  const words=t.split(/\s+/);let i=0;set('explain',false);bub.textContent=''
  if($('voice').checked&&'speechSynthesis' in window)speechSynthesis.speak(new SpeechSynthesisUtterance(t))
  timer=setInterval(()=>{bub.textContent=words.slice(0,++i).join(' ')
    if(i>=words.length){clearInterval(timer);setTimeout(()=>set('thumbs_up',false),500);setTimeout(()=>set('idle',false),2800)}},230)}
$('tour').onclick=()=>{if(tour){stop();return}
  $('tour').classList.add('on');let i=0;const step=()=>set(POSES[i++%POSES.length][0]);step()
  tour=setInterval(step,3200)}
set('idle')
</script></body></html>
