<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Tutor</title>
<style>
:root{--bg:#0d0f14;--panel:#171a22;--ink:#e9ecf4;--mut:#8b93a7;--acc:#2fd0bd}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:18px;padding:24px 16px;

h1{margin:0;font-size:22px}.sub{color:var(--mut);margin-top:-12px;text-align:center}
.stage{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:12px;width:100%;max-width:900px}
canvas{image-rendering:pixelated;width:560px;max-width:66vw;height:auto;aspect-ratio:112/102}
.bubble{background:#fff;color:#14161d;border-radius:14px;padding:12px 16px;width:260px;min-height:56px;font:600 15px/1.4 system-ui,sans-serif;position:relative;margin-bottom:260px;box-shadow:0 4px 0 #0006}
.bubble:before{content:"";position:absolute;left:-10px;bottom:18px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:900px}
button{background:var(--panel);color:var(--ink);border:2px solid #2a2f3d;border-radius:8px;padding:8px 14px;font:600 14px system-ui,sans-serif;cursor:pointer}
button:hover{border-color:var(--acc)}button.on{background:var(--acc);color:#06201c;border-color:var(--acc)}
textarea{width:100%;max-width:520px;background:var(--panel);color:var(--ink);border:2px solid #2a2f3d;border-radius:8px;padding:10px;font:inherit}
.row{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;justify-content:center;width:100%}
label{color:var(--mut);font-size:13px;display:flex;gap:6px;align-items:center}
@media(max-width:640px){.stage{flex-direction:column;align-items:center}.bubble{margin:0;order:-1}.bubble:before{display:none}canvas{max-width:92vw}}
</style></head><body>
<h1 id="ttl">Pip, the pixel tutor</h1>
<div class="sub">Pick a pose, or type something and press Speak. Your tutor nods on each word, blinks, looks around and points.</div>
<div class="stage"><canvas id="cv" width="672" height="612" aria-label="Pip, a pixel-art tutor"></canvas><div class="bubble" id="bub">Hi! I'm Pip. Ask me to explain anything.</div></div>
<div class="bar" id="chars"></div><div class="bar" id="poses"></div><div class="bar" id="exprs"></div>
<div class="row"><textarea id="txt" rows="2">Tokens are the small pieces a model reads. Look over here: each piece gets a number.</textarea>
<button id="speak">Speak</button><button id="tour">Auto tour</button><label><input type="checkbox" id="voice" checked> voice</label></div>

// ---- speech: typed bubble + browser voice; word boundaries drive the nods ----
const bub=document.getElementById('bub');let typer,speechOk='speechSynthesis' in window
function stopSpeech(){clearInterval(typer);talking=false;try{speechSynthesis.cancel()}catch(e){}}
function say(text,opt,done){stopSpeech();talking=true;if(typeof opt=='string')setPose(opt);else if(opt){if(opt.act)setPose(opt.act);if('expr' in opt)setExpr(opt.expr)};let i=0;bub.textContent='';let finished=false
 const end=()=>{if(finished)return;finished=true;clearInterval(typer);bub.textContent=text;talking=false;done&&done()}
 const useVoice=document.getElementById('voice').checked&&speechOk
 const ms=Math.max(28,Math.min(70,(text.length>0?2800/text.length:40)))
 typer=setInterval(()=>{i++;bub.textContent=text.slice(0,i);if(!useVoice&&i%4==0)beat=(performance.now()-t0)/1000;if(i>=text.length){clearInterval(typer);if(!useVoice)setTimeout(end,500)}},ms)
 if(useVoice){try{const u=new SpeechSynthesisUtterance(text);u.rate=1.02;u.onboundary=e=>{beat=(performance.now()-t0)/1000;if(e.charIndex!=null)bub.textContent=text.slice(0,Math.max(i,e.charIndex+e.charLength||0))};u.onend=end;u.onerror=end;speechSynthesis.speak(u)
   setTimeout(()=>{if(!finished&&!speechSynthesis.speaking&&i>=text.length)end()},text.length*70+3000)}catch(e){speechOk=false}}}
document.getElementById('speak').onclick=()=>{tour=false;sync();say(document.getElementById('txt').value.trim()||'Hello!','point')}
const SCRIPT=[['Hi! I am Pip, your tutor for today.','wave'],['A model reads text in small pieces called tokens.','explain'],['Look over here: every piece gets its own number.','point'],['Hmm, but how does it pick the next one?','think'],['Oh! It scores every possible piece, then picks a likely one.','idea'],['You did it! That is how tokens work.','cheer']]
document.getElementById('tour').onclick=async()=>{tour=!tour;sync();let i=0;while(tour){const[txt,p]=SCRIPT[i++%SCRIPT.length];await new Promise(r=>say(txt,p,r));await new Promise(r=>setTimeout(r,500))}}
window.pip={say,mascot:setChar,act:setPose,express:setExpr,actions:Object.keys(POSES),expressions:Object.keys(EXPR)} // so other pages can drive him
